name: Windows final-remux regression

on:
  pull_request:
    paths:
      - 'Batman-v-Superman-IMAX-Restorer.bat'
      - 'tests/**'
      - '.github/workflows/windows-remux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mkv_version: '78.0'
            archive_sha256: '28aeb942e88b9bde8ad93b00020c9ab5289836bffd6df36582a6fd652cc7fdba'
            executable_sha256: 'f707365fc6374db58c875d69fe8d3c3f572ab54369b28a863bc9aaad3ebc09ef'
          - mkv_version: '102.0'
            archive_sha256: 'cd63c42caee3d9e5b631e029657b3bd322beba77e150cecbfc9ae4923638b049'
            executable_sha256: ''
    name: remux (MKVToolNix ${{ matrix.mkv_version }})
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
          # Tests do not use upstream tool submodules or private film files.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Batman-v-Superman-IMAX-Restorer.bat
            /tests/
      - name: Run batch regression matrix with native executable stub
        shell: pwsh
        run: |
          python --version
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Batch regression tests failed' }
      - name: Prepare synthetic-media test tools
        shell: pwsh
        run: |
          $version = '${{ matrix.mkv_version }}'
          $archive = Join-Path $env:RUNNER_TEMP "mkvtoolnix-$version.7z"
          Invoke-WebRequest "https://mkvtoolnix.download/windows/releases/$version/mkvtoolnix-64-bit-$version.7z" -OutFile $archive
          $expected = '${{ matrix.archive_sha256 }}'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'MKVToolNix archive checksum mismatch'
          }
          $toolDir = Join-Path $env:RUNNER_TEMP 'remux-tools'
          7z x $archive "-o$toolDir" -y
          if ($LASTEXITCODE -ne 0) { throw 'Tool extraction failed' }
          $mkvmerge = Get-ChildItem $toolDir -Recurse -Filter mkvmerge.exe | Select-Object -First 1
          if (-not $mkvmerge) { throw 'mkvmerge.exe missing' }
          $expectedExe = '${{ matrix.executable_sha256 }}'
          if ($expectedExe -and (Get-FileHash $mkvmerge.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedExe) {
            throw 'mkvmerge.exe differs from the audited release binary'
          }
          "RESTORER_REAL_MKVMERGE=$($mkvmerge.FullName)" >> $env:GITHUB_ENV
          # Test-only, versioned community package containing the Gyan Windows build.
          # No processing tools are installed on the developer's Mac or repackaged.
          choco install ffmpeg --version=7.1.1 --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg fixture tool installation failed' }
      - name: Run synthetic packet-preservation test
        shell: pwsh
        run: |
          & $env:RESTORER_REAL_MKVMERGE --version
          ffmpeg -version
          ffprobe -version
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic remux test failed' }
