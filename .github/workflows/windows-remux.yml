name: Windows restoration regression

on:
  pull_request:
    paths:
      - 'Batman-v-Superman-IMAX-Restorer.bat'
      - 'tests/**'
      - 'tools/**'
      - 'docs/scripts/**'
      - '.github/workflows/windows-remux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mkv_version: '78.0'
            archive_sha256: '28aeb942e88b9bde8ad93b00020c9ab5289836bffd6df36582a6fd652cc7fdba'
            executable_sha256: 'f707365fc6374db58c875d69fe8d3c3f572ab54369b28a863bc9aaad3ebc09ef'
          - mkv_version: '102.0'
            archive_sha256: 'cd63c42caee3d9e5b631e029657b3bd322beba77e150cecbfc9ae4923638b049'
            executable_sha256: ''
    name: remux (MKVToolNix ${{ matrix.mkv_version }})
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false
          # Tests do not use upstream tool submodules or private film files.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Batman-v-Superman-IMAX-Restorer.bat
            /tests/
            /tools/
            /docs/scripts/
      - name: Run batch regression matrix with native executable stub
        shell: pwsh
        run: |
          python --version
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Batch regression tests failed' }
      - name: Prepare synthetic-media test tools
        shell: pwsh
        run: |
          $version = '${{ matrix.mkv_version }}'
          $archive = Join-Path $env:RUNNER_TEMP "mkvtoolnix-$version.7z"
          Invoke-WebRequest "https://mkvtoolnix.download/windows/releases/$version/mkvtoolnix-64-bit-$version.7z" -OutFile $archive
          $expected = '${{ matrix.archive_sha256 }}'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'MKVToolNix archive checksum mismatch'
          }
          $toolDir = Join-Path $env:RUNNER_TEMP 'remux-tools'
          7z x $archive "-o$toolDir" -y
          if ($LASTEXITCODE -ne 0) { throw 'Tool extraction failed' }
          $mkvmerge = Get-ChildItem $toolDir -Recurse -Filter mkvmerge.exe | Select-Object -First 1
          if (-not $mkvmerge) { throw 'mkvmerge.exe missing' }
          $expectedExe = '${{ matrix.executable_sha256 }}'
          if ($expectedExe -and (Get-FileHash $mkvmerge.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedExe) {
            throw 'mkvmerge.exe differs from the audited release binary'
          }
          "RESTORER_REAL_MKVMERGE=$($mkvmerge.FullName)" >> $env:GITHUB_ENV
          # Test-only Gyan 7.1.1 essentials; checksum from Microsoft's WinGet manifest:
          # manifests/g/Gyan/FFmpeg/Essentials/7.1.1/Gyan.FFmpeg.Essentials.installer.yaml
          $fixtureArchive = Join-Path $env:RUNNER_TEMP 'ffmpeg-7.1.1-essentials.zip'
          Invoke-WebRequest 'https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip' -OutFile $fixtureArchive
          if ((Get-FileHash $fixtureArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4') {
            throw 'FFmpeg fixture archive checksum mismatch'
          }
          $fixtureDir = Join-Path $env:RUNNER_TEMP 'fixture-ffmpeg'
          7z x $fixtureArchive "-o$fixtureDir" 'ffmpeg-7.1.1-essentials_build/bin/*' -y
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg fixture extraction failed' }
          $fixtureBin = Join-Path $fixtureDir 'ffmpeg-7.1.1-essentials_build/bin'
          foreach ($tool in @('ffmpeg.exe', 'ffprobe.exe')) {
            if (-not (Test-Path (Join-Path $fixtureBin $tool) -PathType Leaf)) { throw "$tool fixture missing" }
          }
          $fixtureBin >> $env:GITHUB_PATH
          "RESTORER_FIXTURE_BIN=$fixtureBin" >> $env:GITHUB_ENV
      - name: Prepare checksum-verified historical assembly tools
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'historical-restorer.7z'
          Invoke-WebRequest 'https://github.com/teymourb/Batman-v-Superman-IMAX-Restorer/releases/download/v1.0.0/Batman-v-Superman-IMAX-Restorer_v1.0.0.7z' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7f4701624ae87c21225e339b2caa65085ec7380a446b17bb155d04155ae4829a') {
            throw 'Historical package checksum mismatch'
          }
          $baselineDir = Join-Path $env:RUNNER_TEMP 'historical-assembly-tools'
          # Extract only tool folders. The film-derived logo is never extracted or used.
          7z x $archive "-o$baselineDir" 'Batman-v-Superman-IMAX-Restorer_v1.0.0/docs/programs/avidemux/*' 'Batman-v-Superman-IMAX-Restorer_v1.0.0/docs/programs/ffmpeg/*' -y
          if ($LASTEXITCODE -ne 0) { throw 'Historical tool extraction failed' }
          $avidemux = Get-ChildItem $baselineDir -Recurse -Filter avidemux_cli.exe | Select-Object -First 1
          $ffmpeg = Get-ChildItem $baselineDir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $avidemux -or -not $ffmpeg) { throw 'Historical assembly tools missing' }
          if ((Get-FileHash $avidemux.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7abf1a406ef27f82c121189939be21a8e15908877b4fb40ed37a0208a74828dd') {
            throw 'Avidemux differs from audited executable'
          }
          if ((Get-FileHash $ffmpeg.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd28eec987cf8a2f25f3ce303ff612c35bf7ca541c3a5090de718caf525fb9a62') {
            throw 'FFmpeg differs from audited executable'
          }
          "RESTORER_REAL_AVIDEMUX=$($avidemux.FullName)" >> $env:GITHUB_ENV
          "RESTORER_BUNDLED_FFMPEG=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
          "RESTORER_ASSEMBLY_FFMPEG=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
          & $ffmpeg.FullName -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg failed to launch' }
      - name: Run synthetic media and assembly qualification
        shell: pwsh
        run: |
          & $env:RESTORER_REAL_MKVMERGE --version
          if ($LASTEXITCODE -ne 0) { throw 'mkvmerge failed to launch' }
          foreach ($tool in @('ffmpeg', 'ffprobe')) {
            $expectedTool = Join-Path $env:RESTORER_FIXTURE_BIN "$tool.exe"
            $resolvedTool = (Get-Command $tool -CommandType Application).Source
            if ($resolvedTool -ine $expectedTool) { throw "$tool resolved outside verified fixture directory: $resolvedTool" }
            & $resolvedTool -version
            if ($LASTEXITCODE -ne 0) { throw "$tool fixture failed to launch" }
          }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic remux test failed' }
